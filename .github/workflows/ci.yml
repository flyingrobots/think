name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v5
      # git-cas fixture assets hang off refs/cas/*, which checkout does not fetch.
      # Tests skip cleanly when they are absent, so a failure here must not fail CI.
      - name: Fetch git-cas fixture assets
        run: |
          git fetch --no-tags origin '+refs/cas/*:refs/cas/*' \
            || echo "refs/cas/* unavailable; CAS-backed fixtures will skip"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
